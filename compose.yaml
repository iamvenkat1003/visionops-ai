services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: sqlite:///./data/visionops.db
      DATA_DIR: /app/data
      MODEL_PATH: /app/data/models/yolo11n.pt
      MODEL_DEVICE: cpu
      DEMO_MODE: "false"
      JWT_SECRET: ${JWT_SECRET:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      DEMO_EMPLOYEE_PASSWORD: ${DEMO_EMPLOYEE_PASSWORD:-EmployeeDemo!2026}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-AdminDemo!2026}
    volumes:
      - visionops-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  visionops-data:
